<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f9ff" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Nova chave PIX — QR PIX</title>
  <script src="ui.js"></script>
  <script src="pix-utils.js"></script>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="qr-pix-icon-192.png" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" />
  <link rel="stylesheet" href="style.css" />
  <script type="module" src="material.js"></script>
</head>
<body>

  <header class="app-bar">
    <md-icon-button data-nav="back" data-fallback="generate-invoice.html" aria-label="Voltar">
      <md-icon>arrow_back</md-icon>
    </md-icon-button>
    <h1 class="app-bar__title">Nova chave PIX</h1>
  </header>

  <main class="app-main">
    <form class="page" id="form" novalidate>

      <section class="section" aria-labelledby="sec-owner">
        <div class="section__header"><h2 class="section__title" id="sec-owner">Quem recebe</h2></div>
        <div class="card form">
          <md-outlined-text-field id="field-name" label="Nome do recebedor" autocomplete="name" required no-asterisk>
            <md-icon slot="leading-icon">person</md-icon>
          </md-outlined-text-field>
          <div class="field">
            <md-outlined-text-field id="field-bank" label="Banco ou instituição" autocomplete="off" required no-asterisk>
              <md-icon slot="leading-icon">account_balance</md-icon>
            </md-outlined-text-field>
          </div>
        </div>
      </section>

      <section class="section" aria-labelledby="sec-key">
        <div class="section__header"><h2 class="section__title" id="sec-key">Chave PIX</h2></div>
        <div class="card form">
          <md-chip-set id="key-types" aria-label="Tipo de chave"></md-chip-set>
          <div class="field">
            <md-outlined-text-field id="field-key" label="Escolha o tipo acima" disabled autocomplete="off" supporting-text=" ">
              <md-icon slot="leading-icon">key</md-icon>
            </md-outlined-text-field>
            <span class="field__status" id="key-status" aria-hidden="true"></span>
          </div>
        </div>
      </section>

    </form>
  </main>

  <footer class="app-footer">
    <md-filled-button id="btn-confirm" trailing-icon disabled>
      Salvar e definir valor
      <md-icon slot="icon">arrow_forward</md-icon>
    </md-filled-button>
  </footer>

  <script src="key-form.js"></script>
  <script>
    (function () {
      const { keys, tx } = PixUtils;
      const name = document.getElementById('field-name');
      const bank = document.getElementById('field-bank');
      const btn  = document.getElementById('btn-confirm');

      const keyForm = KeyForm.mount({
        chips: document.getElementById('key-types'),
        field: document.getElementById('field-key'),
        status: document.getElementById('key-status'),
        onChange: update,
      });
      KeyForm.bankAutocomplete(bank, update);

      function update() {
        btn.disabled = !(name.value.trim() && bank.value.trim() && keyForm.isValid());
      }
      name.addEventListener('input', update);

      function submit(e) {
        e && e.preventDefault();
        if (btn.disabled) { keyForm.showErrors(); return; }
        const entry = { name: name.value.trim(), bank: bank.value.trim(), keyType: keyForm.type(), key: keyForm.value() };
        keys.add(entry);
        tx.set(entry);
        location.href = 'set-value.html';
      }
      document.getElementById('form').addEventListener('submit', submit);
      btn.addEventListener('click', submit);
    })();
  </script>
</body>
</html>
