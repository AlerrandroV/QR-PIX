<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fundo maskable (100% preenchido para safe zone da PWA) -->
  <rect width="512" height="512" fill="#006493"/>

  <!-- Símbolo Pix: losangos concêntricos + 4 losangos nos quadrantes -->
  <g transform="translate(256,256)" fill="white">
    <!-- Losango externo -->
    <polygon points="0,-110 110,0 0,110 -110,0" fill="none" stroke="white" stroke-width="22" stroke-linejoin="round"/>
    <!-- Losango médio -->
    <polygon points="0,-70 70,0 0,70 -70,0" fill="none" stroke="white" stroke-width="22" stroke-linejoin="round"/>
    <!-- Losangos nos 4 quadrantes -->
    <polygon points="0,-90 20,-70 0,-50 -20,-70"/>
    <polygon points="0,90 20,70 0,50 -20,70"/>
    <polygon points="-90,0 -70,20 -50,0 -70,-20"/>
    <polygon points="90,0 70,20 50,0 70,-20"/>
  </g>
</svg>
