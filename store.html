<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f9ff" />
  <title>Loja — QR PIX</title>
  <script src="ui.js"></script>
  <script src="pix-utils.js"></script>
  <script src="data.js"></script>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="qr-pix-icon-192.png" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" />
  <link rel="stylesheet" href="style.css" />
  <script type="module" src="material.js"></script>
</head>
<body>

  <header class="app-bar">
    <md-icon-button data-nav="back" data-fallback="profile.html" aria-label="Voltar" id="btn-back" hidden>
      <md-icon>arrow_back</md-icon>
    </md-icon-button>
    <h1 class="app-bar__title" id="preview-title" hidden>Pré-visualização</h1>
    <a class="brand" href="index.html" id="brand" aria-label="QR PIX">
      <span class="brand__mark" aria-hidden="true"></span>
      <span class="brand__name" id="bar-title">QR-PIX</span>
    </a>
    <div class="app-bar__actions">
      <md-icon-button id="btn-share" aria-label="Compartilhar loja" hidden>
        <md-icon>share</md-icon>
      </md-icon-button>
    </div>
  </header>

  <main class="app-main">
    <div class="page" id="page">

      <section class="banner banner--info" id="preview-banner" hidden>
        <span class="icon">visibility</span>
        <span class="body">Pré-visualização: é assim que seus clientes veem a loja.</span>
      </section>

      <section class="card" id="state" aria-live="polite">
        <div class="empty">
          <span class="empty__icon"><span class="icon spin">progress_activity</span></span>
          <p class="empty__title">Carregando loja…</p>
        </div>
      </section>

      <section class="card card--center hero" id="hero" hidden>
        <span class="hero__avatar" id="s-avatar"><span class="icon">storefront</span></span>
        <h1 class="headline" id="s-name"></h1>
        <p class="body muted" id="s-username"></p>
        <p class="body" id="s-bio" hidden></p>
        <span class="badge" id="s-city" hidden><span class="icon icon--sm">location_on</span><span></span></span>
        <div class="contact-row" id="s-contacts"></div>
      </section>

      <section class="section" id="sec-products" hidden aria-labelledby="h-products">
        <div class="section__header">
          <h2 class="section__title" id="h-products">Catálogo</h2>
          <span class="label muted" id="s-count"></span>
        </div>
        <div class="product-grid" id="grid"></div>
      </section>

      <p class="section__hint center" id="powered" hidden>
        Loja criada com <a href="index.html">QR PIX</a> — catálogo e cobranças PIX grátis.
      </p>
    </div>
  </main>

  <footer class="app-footer" id="footer" hidden>
    <md-outlined-button id="btn-pix" class="app-footer__secondary" hidden>
      <md-icon slot="icon">pix</md-icon>
      Pagar
    </md-outlined-button>
    <md-filled-button id="btn-contact" hidden>
      <md-icon slot="icon" id="btn-contact-icon">chat</md-icon>
      <span id="btn-contact-label">Chamar no WhatsApp</span>
    </md-filled-button>
  </footer>

  <script src="store.js"></script>
</body>
</html>
