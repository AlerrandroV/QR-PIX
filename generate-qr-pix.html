<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f9ff" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>QR Code PIX — QR PIX</title>
  <script src="ui.js"></script>
  <script src="pix-utils.js"></script>
  <script src="pix-payload.js"></script>
  <script src="qr-code-styling.js"></script>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="qr-pix-icon-192.png" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" />
  <link rel="stylesheet" href="style.css" />
  <script type="module" src="material.js"></script>
</head>
<body>

  <header class="app-bar">
    <md-icon-button data-nav="back" data-fallback="index.html" aria-label="Voltar">
      <md-icon>arrow_back</md-icon>
    </md-icon-button>
    <h1 class="app-bar__title">QR Code PIX</h1>
    <div class="app-bar__actions">
      <md-icon-button href="index.html" id="btn-home" aria-label="Concluir e voltar ao início">
        <md-icon>home</md-icon>
      </md-icon-button>
    </div>
  </header>

  <main class="app-main">
    <div class="page">

      <section class="card card--center" aria-label="QR Code para pagamento">
        <div class="qr-frame" id="qr-output"></div>
        <div>
          <p class="headline" id="info-value">—</p>
          <p class="card__text" id="info-to">—</p>
        </div>
      </section>

      <section class="section" aria-labelledby="sec-copy">
        <div class="section__header"><h2 class="section__title" id="sec-copy">Pix Copia e Cola</h2></div>
        <div class="card">
          <p class="code" id="copypaste-code"></p>
          <div class="card__actions">
            <md-filled-tonal-button id="btn-copy">
              <md-icon slot="icon">content_copy</md-icon>
              Copiar código
            </md-filled-tonal-button>
          </div>
        </div>
      </section>

      <section class="section" aria-labelledby="sec-details">
        <div class="section__header"><h2 class="section__title" id="sec-details">Detalhes</h2></div>
        <div class="card card--list">
          <div class="list-item">
            <span class="list-item__leading list-item__leading--plain"><span class="icon">person</span></span>
            <span class="list-item__content">
              <span class="list-item__overline">Recebedor</span>
              <span class="list-item__headline list-item__headline--wrap" id="info-name">—</span>
            </span>
          </div>
          <div class="list-item">
            <span class="list-item__leading list-item__leading--plain"><span class="icon">account_balance</span></span>
            <span class="list-item__content">
              <span class="list-item__overline">Instituição</span>
              <span class="list-item__headline list-item__headline--wrap" id="info-bank">—</span>
            </span>
          </div>
          <div class="list-item">
            <span class="list-item__leading list-item__leading--plain"><span class="icon">key</span></span>
            <span class="list-item__content">
              <span class="list-item__overline" id="info-key-type">Chave PIX</span>
              <span class="list-item__headline list-item__headline--wrap selectable" id="info-key">—</span>
            </span>
          </div>
        </div>
      </section>

    </div>
  </main>

  <footer class="app-footer">
    <md-outlined-button id="btn-download">
      <md-icon slot="icon">download</md-icon>
      Baixar
    </md-outlined-button>
    <md-filled-button id="btn-share">
      <md-icon slot="icon">share</md-icon>
      Compartilhar
    </md-filled-button>
  </footer>

  <script src="generate-qr-pix.js"></script>
</body>
</html>
