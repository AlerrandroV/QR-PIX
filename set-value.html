<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f9ff" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Valor da cobrança — QR PIX</title>
  <script src="ui.js"></script>
  <script src="pix-utils.js"></script>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="qr-pix-icon-192.png" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" />
  <link rel="stylesheet" href="style.css" />
  <script type="module" src="material.js"></script>
</head>
<body>

  <header class="app-bar">
    <md-icon-button data-nav="back" data-fallback="generate-invoice.html" aria-label="Voltar">
      <md-icon>arrow_back</md-icon>
    </md-icon-button>
    <h1 class="app-bar__title">Valor da cobrança</h1>
  </header>

  <main class="app-main">
    <div class="page page--fill">

      <section class="card card--list" aria-label="Recebedor">
        <div class="list-item list-item--two-line">
          <span class="list-item__leading list-item__leading--primary list-item__leading--avatar" id="tx-initials">?</span>
          <span class="list-item__content">
            <span class="list-item__headline" id="tx-name">—</span>
            <span class="list-item__supporting" id="tx-meta">—</span>
          </span>
        </div>
      </section>

      <section class="grow amount-area" aria-live="polite">
        <div class="amount" id="amount">
          <span class="amount__currency">R$</span>
          <span class="amount__value" id="amount-value">0,00</span>
        </div>
        <p class="section__hint center">Deixe R$ 0,00 para o cliente digitar o valor no banco.</p>
      </section>

      <section class="numpad" aria-label="Teclado numérico">
        <button class="numpad__key" type="button" data-key="1">1</button>
        <button class="numpad__key" type="button" data-key="2">2</button>
        <button class="numpad__key" type="button" data-key="3">3</button>
        <button class="numpad__key" type="button" data-key="4">4</button>
        <button class="numpad__key" type="button" data-key="5">5</button>
        <button class="numpad__key" type="button" data-key="6">6</button>
        <button class="numpad__key" type="button" data-key="7">7</button>
        <button class="numpad__key" type="button" data-key="8">8</button>
        <button class="numpad__key" type="button" data-key="9">9</button>
        <button class="numpad__key numpad__key--muted" type="button" data-key="00">00</button>
        <button class="numpad__key" type="button" data-key="0">0</button>
        <button class="numpad__key numpad__key--muted" type="button" data-key="del" aria-label="Apagar">
          <span class="icon">backspace</span>
        </button>
      </section>

    </div>
  </main>

  <footer class="app-footer">
    <md-filled-button id="btn-confirm" trailing-icon>
      Gerar QR Code
      <md-icon slot="icon">qr_code_2</md-icon>
    </md-filled-button>
  </footer>

  <script>
    (function () {
      const { tx, KEY_TYPES, formatCents, initials } = PixUtils;
      const t = tx.read();
      if (!t.key) { location.replace('generate-invoice.html'); return; }

      document.getElementById('tx-initials').textContent = initials(t.name);
      document.getElementById('tx-name').textContent = t.name || 'Recebedor';
      document.getElementById('tx-meta').textContent =
        [t.bank, (KEY_TYPES[t.keyType]?.label || '') + ' ' + t.key].filter(Boolean).join(' · ');

      const MAX_DIGITS = 10;
      let digits = t.value ? String(t.value) : '';
      const amount = document.getElementById('amount');
      const amountValue = document.getElementById('amount-value');

      function render() {
        const cents = parseInt(digits || '0', 10);
        amountValue.textContent = formatCents(cents);
        amount.classList.toggle('is-set', cents > 0);
      }

      function press(k) {
        if (k === 'del') digits = digits.slice(0, -1);
        else if (k === 'clear') digits = '';
        else if (!digits && (k === '0' || k === '00')) return;
        else digits = (digits + k).slice(0, MAX_DIGITS);
        if (navigator.vibrate) navigator.vibrate(8);
        render();
      }

      document.querySelectorAll('.numpad__key').forEach((b) => b.addEventListener('click', () => press(b.dataset.key)));

      // Teclado físico
      document.addEventListener('keydown', (e) => {
        if (/^[0-9]$/.test(e.key)) press(e.key);
        else if (e.key === 'Backspace') press('del');
        else if (e.key === 'Delete' || e.key === 'Escape') press('clear');
        else if (e.key === 'Enter') confirm();
      });

      function confirm() {
        const value = parseInt(digits || '0', 10);
        tx.set({ ...t, value });
        location.href = 'generate-qr-pix.html';
      }
      document.getElementById('btn-confirm').addEventListener('click', confirm);
      render();
    })();
  </script>
</body>
</html>
