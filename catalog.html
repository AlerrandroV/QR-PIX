<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f9ff" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Catálogo — QR PIX</title>
  <script src="ui.js"></script>
  <script src="pix-utils.js"></script>
  <script src="data.js"></script>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="qr-pix-icon-192.png" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" />
  <link rel="stylesheet" href="style.css" />
  <script type="module" src="material.js"></script>
</head>
<body>

  <header class="app-bar">
    <h1 class="app-bar__title">Catálogo</h1>
    <div class="app-bar__actions">
      <md-icon-button href="store.html?preview=1" aria-label="Ver como cliente">
        <md-icon>visibility</md-icon>
      </md-icon-button>
    </div>
  </header>

  <main class="app-main">
    <div class="page">

      <section class="banner banner--info" id="no-profile" hidden>
        <span class="icon">info</span>
        <span class="body">Para publicar o catálogo, <a href="create-profile.html">crie o perfil da sua loja</a>.</span>
      </section>

      <section class="section" aria-labelledby="h-items">
        <div class="section__header">
          <h2 class="section__title" id="h-items">Produtos</h2>
          <span class="label muted" id="count"></span>
        </div>
        <md-outlined-text-field id="search" type="search" placeholder="Buscar produto" aria-label="Buscar produto" hidden>
          <md-icon slot="leading-icon">search</md-icon>
        </md-outlined-text-field>
        <div class="card" id="list"></div>
      </section>

    </div>
  </main>

  <footer class="app-footer">
    <md-filled-button href="product-edit.html">
      <md-icon slot="icon">add</md-icon>
      Novo produto
    </md-filled-button>
  </footer>

  <nav class="app-nav" data-current="catalog"></nav>

  <script>
    (async function () {
      const D = QrData, esc = QrUI.escapeHtml, { formatCurrency } = PixUtils;
      const list = document.getElementById('list');
      const search = document.getElementById('search');
      let query = '';

      async function render() {
        const all = await D.products.all();
        const q = query.toLowerCase();
        const items = all.filter((p) => !q || (p.name + ' ' + (p.description || '')).toLowerCase().includes(q));
        search.hidden = all.length < 6;
        document.getElementById('count').textContent = all.length ? `${all.length} no total` : '';
        list.classList.toggle('card--list', items.length > 0);

        if (!items.length) {
          list.innerHTML = q
            ? `<div class="empty"><span class="empty__icon"><span class="icon">search_off</span></span>
                 <p class="empty__title">Nenhum produto encontrado</p></div>`
            : `<div class="empty"><span class="empty__icon"><span class="icon">inventory_2</span></span>
                 <p class="empty__title">Seu catálogo está vazio</p>
                 <p class="empty__text">Adicione fotos, preços e descrições. Os clientes pedem direto no seu WhatsApp.</p></div>`;
          return;
        }

        list.innerHTML = items.map((p) => `
          <a class="list-item list-item--action list-item--two-line${p.available === false ? ' is-unavailable' : ''}" href="product-edit.html?id=${encodeURIComponent(p.id)}">
            <span class="list-item__leading list-item__leading--image">
              ${p.imageDataUrl ? `<img src="${esc(p.imageDataUrl)}" alt="" />` : '<span class="icon">image</span>'}
            </span>
            <span class="list-item__content">
              <span class="list-item__headline">${esc(p.name)}</span>
              <span class="list-item__supporting">${p.priceCents ? formatCurrency(p.priceCents) : 'Preço sob consulta'}</span>
            </span>
            <span class="list-item__trailing">
              ${p.available === false ? '<span class="badge">Esgotado</span>' : '<span class="icon">chevron_right</span>'}
            </span>
          </a>`).join('');
      }

      search.addEventListener('input', () => { query = search.value.trim(); render(); });
      window.addEventListener('qrdata:change', render);
      document.getElementById('no-profile').hidden = await D.profile.exists();
      render();
    })();
  </script>
</body>
</html>
